<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SamanAI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #171717;
    }

    .app {
      max-width: 760px;
      height: 100vh;
      margin: auto;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    header small {
      display: block;
      font-size: 12px;
      opacity: .7;
      margin-top: 4px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 14px;
    }

    .welcome {
      text-align: center;
      margin-top: 25vh;
    }

    .logo {
      font-size: 55px;
      margin-bottom: 10px;
    }

    .welcome h1 {
      margin: 5px;
      font-size: 30px;
    }

    .welcome p {
      color: #666;
    }

    .message {
      padding: 13px 15px;
      margin: 10px 0;
      border-radius: 16px;
      max-width: 88%;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    .user {
      background: #111827;
      color: white;
      margin-right: auto;
    }

    .ai {
      background: white;
      border: 1px solid #e5e7eb;
      margin-left: auto;
    }

    .input-area {
      padding: 12px;
      background: white;
      border-top: 1px solid #e5e7eb;
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      outline: none;
      font-size: 16px;
      direction: auto;
    }

    input:focus {
      border-color: #111827;
    }

    button {
      padding: 0 20px;
      border: none;
      border-radius: 14px;
      background: #111827;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
    }

    @media (max-width: 600px) {
      .app {
        width: 100%;
      }

      header {
        font-size: 21px;
      }

      .welcome {
        margin-top: 20vh;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      🤖 SamanAI
      <small>یاریدەدەری زیرەکی تۆ</small>
    </header>

    <div id="chat">

      <div class="welcome" id="welcome">
        <div class="logo">🤖</div>
        <h1>بەخێربێیت بۆ SamanAI</h1>
        <p>پرسیارێکت هەیە؟ لێرە بینووسە.</p>
      </div>

    </div>

    <div class="input-area">
      <input
        id="message"
        type="text"
        placeholder="نامەکەت بنووسە..."
        autocomplete="off"
      >
      <button id="send" onclick="sendMessage()">ناردن</button>
    </div>

  </div>

  <script>
    async function sendMessage() {
      const input = document.getElementById("message");
      const button = document.getElementById("send");
      const chat = document.getElementById("chat");
      const welcome = document.getElementById("welcome");

      const message = input.value.trim();

      if (!message) return;

      if (welcome) {
        welcome.remove();
      }

      const userMessage = document.createElement("div");
      userMessage.className = "message user";
      userMessage.textContent = message;
      chat.appendChild(userMessage);

      input.value = "";
      button.disabled = true;

      const loading = document.createElement("div");
      loading.className = "message ai";
      loading.textContent = "SamanAI بیر دەکاتەوە... 🤔";
      chat.appendChild(loading);

      chat.scrollTop = chat.scrollHeight;

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ message })
        });

        const data = await response.json();

        if (!response.ok) {
          loading.textContent =
            data.error || "هەڵەیەک ڕوویدا.";
        } else {
          loading.textContent =
            data.reply || "وەڵامێک نەگەڕایەوە.";
        }

      } catch (error) {
        loading.textContent =
          "پەیوەندی بە سێرڤەرەکە نەکرا.";
      }

      button.disabled = false;
      input.focus();

      chat.scrollTop = chat.scrollHeight;
    }

    document.getElementById("message").addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>

</body>
</html>
