<!DOCTYPE html>
<html lang="ku" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>SamanAI</title>

  <style>

    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #737b8c;
      --border: #e5e7eb;
      --bubble-ai: #ffffff;
      --bubble-user: #111827;
      --button: #111827;
      --button-text: #ffffff;
    }

    body.dark {
      --bg: #080d18;
      --card: #101827;
      --text: #f8fafc;
      --muted: #9ca3af;
      --border: #263244;
      --bubble-ai: #111827;
      --bubble-user: #273449;
      --button: #f8fafc;
      --button-text: #111827;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
    }

    body {
      font-family: Arial, sans-serif;
      color: var(--text);
      transition: .25s;
    }

    .app {
      width: 100%;
      max-width: 900px;
      height: 100dvh;
      margin: auto;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    header {
      flex-shrink: 0;
      height: 72px;
      padding: 10px 14px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: var(--card);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 48px;
      height: 48px;

      border-radius: 16px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #111827;
      font-size: 25px;

      box-shadow: 0 7px 22px rgba(0,0,0,.12);
    }

    .brand-text h1 {
      margin: 0;
      font-size: 19px;
    }

    .brand-text p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 11px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .online {
      display: flex;
      align-items: center;
      gap: 5px;

      color: #16a34a;
      font-size: 11px;
      font-weight: bold;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
    }

    #themeBtn {
      width: 42px;
      height: 42px;

      border-radius: 13px;
      border: 1px solid var(--border);

      background: var(--bg);
      color: var(--text);

      font-size: 19px;
    }

    #chat {
      flex: 1;
      min-height: 0;

      overflow-y: auto;

      padding: 20px 14px;

      scroll-behavior: smooth;
    }

    #chat::-webkit-scrollbar {
      width: 4px;
    }

    #chat::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 20px;
    }

    .welcome {
      height: 100%;
      min-height: 0;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;

      padding: 20px;
    }

    .welcome-logo {
      width: 100px;
      height: 100px;

      border-radius: 30px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #111827;

      font-size: 52px;

      box-shadow:
        0 15px 40px rgba(0,0,0,.16);

      margin-bottom: 20px;
    }

    .welcome h2 {
      margin: 0;

      font-size: 27px;
      color: var(--text);
    }

    .welcome p {
      margin-top: 10px;

      color: var(--muted);

      font-size: 14px;
      line-height: 1.8;
    }

    .message {
      width: fit-content;
      max-width: 88%;

      padding: 12px 15px;

      margin: 8px 0;

      border-radius: 18px;

      line-height: 1.7;

      white-space: pre-wrap;
      word-break: break-word;

      animation: appear .2s ease;
    }

    @keyframes appear {

      from {
        opacity: 0;
        transform: translateY(7px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }

    .user {
      margin-right: auto;

      background: var(--bubble-user);
      color: white;

      border-bottom-right-radius: 5px;
    }

    .ai {
      margin-left: auto;

      background: var(--bubble-ai);
      color: var(--text);

      border: 1px solid var(--border);

      border-bottom-left-radius: 5px;

      box-shadow: 0 3px 12px rgba(0,0,0,.04);
    }

    .message img {
      display: block;

      max-width: 280px;
      width: 100%;

      border-radius: 14px;
    }

    #status {
      flex-shrink: 0;

      min-height: 22px;

      text-align: center;

      color: var(--muted);

      font-size: 11px;

      padding: 3px;
    }

    .input-area {
      flex-shrink: 0;

      padding: 9px 10px;

      padding-bottom:
        calc(9px + env(safe-area-inset-bottom));

      display: flex;
      align-items: center;
      gap: 7px;

      background: var(--card);

      border-top: 1px solid var(--border);
    }

    .input-box {
      flex: 1;

      min-width: 0;

      height: 50px;

      display: flex;
      align-items: center;

      background: var(--bg);

      border: 1px solid var(--border);

      border-radius: 17px;

      padding: 3px 5px;
    }

    #message {
      flex: 1;

      min-width: 0;

      border: none;
      outline: none;

      background: transparent;

      color: var(--text);

      font-size: 16px;

      padding: 10px;

      direction: rtl;
    }

    #message::placeholder {
      color: var(--muted);
    }

    .icon-btn {
      width: 43px;
      height: 43px;

      min-width: 43px;

      border: none;

      border-radius: 13px;

      background: transparent;

      color: var(--text);

      font-size: 20px;

      cursor: pointer;
    }

    .icon-btn:active {
      transform: scale(.92);
    }

    .icon-btn:hover {
      background: var(--border);
    }

    #send {
      width: 50px;
      height: 50px;

      min-width: 50px;

      border: none;

      border-radius: 16px;

      background: var(--button);

      color: var(--button-text);

      font-size: 21px;

      cursor: pointer;
    }

    #send:disabled {
      opacity: .45;
    }

    #mic.recording {
      background: #dc2626;
      color: white;

      animation: pulse 1s infinite;
    }

    @keyframes pulse {

      0% {
        box-shadow: 0 0 0 0 rgba(220,38,38,.4);
      }

      70% {
        box-shadow: 0 0 0 10px rgba(220,38,38,0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(220,38,38,0);
      }

    }

    #imageInput {
      display: none;
    }

    @media (max-width: 600px) {

      header {
        height: 66px;
        padding: 8px 10px;
      }

      .logo {
        width: 44px;
        height: 44px;

        border-radius: 14px;
      }

      .brand-text h1 {
        font-size: 17px;
      }

      .online {
        display: none;
      }

      #chat {
        padding: 15px 10px;
      }

      .welcome-logo {
        width: 88px;
        height: 88px;

        border-radius: 27px;

        font-size: 46px;
      }

      .welcome h2 {
        font-size: 23px;
      }

      .message {
        max-width: 92%;
      }

      .input-area {
        gap: 5px;
        padding-left: 7px;
        padding-right: 7px;
      }

      .input-box {
        height: 48px;
      }

      .icon-btn {
        width: 40px;
        height: 40px;
        min-width: 40px;
      }

      #send {
        width: 47px;
        height: 47px;
        min-width: 47px;
      }

    }

  </style>
</head>

<body>

<div class="app">

  <header>

    <div class="brand">

      <div class="logo">
        🤖
      </div>

      <div class="brand-text">

        <h1>SamanAI</h1>

        <p>یاریدەدەری زیرەکی تۆ</p>

      </div>

    </div>

    <div class="header-right">

      <div class="online">
        <span class="dot"></span>
        Online
      </div>

      <button
        id="themeBtn"
        type="button"
        onclick="toggleTheme()">
        🌙
      </button>

    </div>

  </header>

  <div id="chat">

    <div
      class="welcome"
      id="welcome">

      <div class="welcome-logo">
        🤖
      </div>

      <h2>
        بەخێربێیت بۆ SamanAI
      </h2>

      <p>
        من ئامادەم بۆ گفتوگۆ ❤️
        <br>
        بنووسە، قسە بکە، یان وێنەیەک بنێرە.
      </p>

    </div>

  </div>

  <div id="status"></div>

  <div class="input-area">

    <button
      class="icon-btn"
      id="imageBtn"
      type="button"
      onclick="document.getElementById('imageInput').click()">
      📷
    </button>

    <input
      id="imageInput"
      type="file"
      accept="image/*">

    <div class="input-box">

      <input
        id="message"
        type="text"
        placeholder="نامەکەت بنووسە..."
        autocomplete="off">

      <button
        class="icon-btn"
        id="mic"
        type="button"
        onclick="startVoice()">
        🎙️
      </button>

    </div>

    <button
      id="send"
      type="button"
      onclick="sendMessage()">
      ➤
    </button>

  </div>

</div>

<script>

let messages = [];
let recognition = null;


/* =========================
   USER ID
========================= */

function getUserId() {

  let userId =
    localStorage.getItem("samanai-user-id");

  if (!userId) {

    if (
      window.crypto &&
      typeof window.crypto.randomUUID === "function"
    ) {

      userId =
        window.crypto.randomUUID();

    } else {

      userId =
        "user-" +
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .slice(2);

    }

    localStorage.setItem(
      "samanai-user-id",
      userId
    );
  }

  return userId;
}

const userId = getUserId();


/* =========================
   THEME
========================= */

function toggleTheme() {

  document.body.classList.toggle("dark");

  const dark =
    document.body.classList.contains("dark");

  document.getElementById("themeBtn").textContent =
    dark ? "☀️" : "🌙";

  localStorage.setItem(
    "samanai-theme",
    dark ? "dark" : "light"
  );

}


function loadTheme() {

  const theme =
    localStorage.getItem("samanai-theme");

  if (theme === "dark") {

    document.body.classList.add("dark");

    document.getElementById("themeBtn").textContent =
      "☀️";

  }

}

loadTheme();


/* =========================
   VOICE
========================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (SpeechRecognition) {

  recognition =
    new SpeechRecognition();

  recognition.lang = "ku-IQ";

  recognition.continuous = false;

  recognition.interimResults = false;


  recognition.onstart = function() {

    document
      .getElementById("mic")
      .classList.add("recording");

    document
      .getElementById("status")
      .textContent =
      "🎙️ گوێم لێتە...";

  };


  recognition.onresult = function(event) {

    let text =
      event.results[0][0].transcript;

    text = text
      .replace(/سومەر/gi, "سامان")
      .replace(/سۆمەر/gi, "سامان")
      .replace(/سومار/gi, "سامان")
      .replace(/Sumer/gi, "Saman");

    document
      .getElementById("message")
      .value = text;

    document
      .getElementById("status")
      .textContent =
      "دەنگەکە وەرگیرا 🎤";

    sendMessage();

  };


  recognition.onerror = function() {

    document
      .getElementById("status")
      .textContent =
      "نەتوانرا دەنگ وەرگیرێت.";

  };


  recognition.onend = function() {

    document
      .getElementById("mic")
      .classList.remove("recording");

  };

}


function startVoice() {

  if (!recognition) {

    alert(
      "Browser ـەکەت Speech Recognition پشتگیری ناکات. Chrome تاقی بکەرەوە."
    );

    return;

  }

  try {

    recognition.start();

  } catch (error) {

    console.log(error);

  }

}


/* =========================
   IMAGE
========================= */

document
  .getElementById("imageInput")
  .addEventListener(
    "change",
    handleImage
  );


async function handleImage(event) {

  const file =
    event.target.files[0];

  if (!file) return;

  const chat =
    document.getElementById("chat");

  const welcome =
    document.getElementById("welcome");

  if (welcome) {
    welcome.remove();
  }

  const imageMessage =
    document.createElement("div");

  imageMessage.className =
    "message user";

  const image =
    document.createElement("img");

  image.src =
    URL.createObjectURL(file);

  imageMessage.appendChild(image);

  chat.appendChild(imageMessage);

  chat.scrollTop =
    chat.scrollHeight;

  const base64 =
    await fileToBase64(file);

  try {

    const response =
      await fetch("/api/chat", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          messages: messages,

          image: base64,

          imageType: file.type,

          userId: userId

        })

      });

    const data =
      await response.json();

    const reply =
      document.createElement("div");

    reply.className =
      "message ai";

    reply.textContent =
      data.reply ||
      data.error ||
      "هەڵەیەک ڕوویدا.";

    chat.appendChild(reply);

    if (data.reply) {
      speak(data.reply);
    }

  } catch (error) {

    const errorMessage =
      document.createElement("div");

    errorMessage.className =
      "message ai";

    errorMessage.textContent =
      "نەتوانرا وێنەکە بنێردرێت.";

    chat.appendChild(errorMessage);

  }

  chat.scrollTop =
    chat.scrollHeight;

  event.target.value = "";

}


function fileToBase64(file) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();

      reader.onload = function() {

        resolve(
          reader.result.split(",")[1]
        );

      };

      reader.onerror =
        reject;

      reader.readAsDataURL(file);

    }
  );

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage() {

  const input =
    document.getElementById("message");

  const button =
    document.getElementById("send");

  const chat =
    document.getElementById("chat");

  const message =
    input.value.trim();

  if (!message) return;

  const welcome =
    document.getElementById("welcome");

  if (welcome) {
    welcome.remove();
  }

  const userMessage =
    document.createElement("div");

  userMessage.className =
    "message user";

  userMessage.textContent =
    message;

  chat.appendChild(userMessage);

  messages.push({

    role: "user",

    content: message

  });

  input.value = "";

  button.disabled = true;

  const loading =
    document.createElement("div");

  loading.className =
    "message ai";

  loading.textContent =
    "SamanAI دەفکەرێت... 🤔";

  chat.appendChild(loading);

  chat.scrollTop =
    chat.scrollHeight;

  try {

    const response =
      await fetch("/api/chat", {

        method: "POST",

        headers: {

          "Content-Type":
            "application/json"

        },

        body: JSON.stringify({

          messages: messages,

          userId: userId

        })

      });

    const data =
      await response.json();

    if (!response.ok) {

      loading.textContent =
        data.error ||
        "هەڵەیەک ڕوویدا.";

    } else {

      loading.textContent =
        data.reply;

      messages.push({

        role: "assistant",

        content: data.reply

      });

      speak(data.reply);

    }

  } catch (error) {

    loading.textContent =
      "پەیوەندی بە AI نەکرا.";

  }

  button.disabled = false;

  input.focus();

  chat.scrollTop =
    chat.scrollHeight;

}


/* =========================
   SPEECH
========================= */

function speak(text) {

  if (!("speechSynthesis" in window)) {
    return;
  }

  window.speechSynthesis.cancel();

  const speech =
    new SpeechSynthesisUtterance(text);

  speech.lang = "ku";

  speech.rate = 0.95;

  speech.pitch = 1;

  window.speechSynthesis.speak(
    speech
  );

}


/* =========================
   ENTER
========================= */

document
  .getElementById("message")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {

        event.preventDefault();

        sendMessage();

      }

    }
  );

</script>

</body>
</html>
