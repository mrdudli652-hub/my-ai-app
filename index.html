<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SamanAI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #111827;
      --user: #111827;
      --ai: #ffffff;
    }

    body.dark {
      --bg: #0b1120;
      --card: #111827;
      --text: #f9fafb;
      --muted: #9ca3af;
      --border: #263244;
      --primary: #f9fafb;
      --user: #263244;
      --ai: #111827;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background .25s, color .25s;
    }

    .app {
      width: 100%;
      max-width: 850px;
      height: 100vh;
      height: 100dvh;
      margin: auto;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    /* =========================
       HEADER
    ========================== */

    header {
      padding: 14px 18px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand-logo {
      width: 46px;
      height: 46px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      background: var(--primary);
      color: var(--bg);
      box-shadow: 0 5px 18px rgba(0,0,0,.12);
    }

    .brand-text h1 {
      margin: 0;
      font-size: 19px;
    }

    .brand-text small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .online {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #16a34a;
      font-size: 12px;
      font-weight: bold;
    }

    .online-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 4px rgba(34,197,94,.12);
    }

    #themeBtn {
      width: 42px;
      height: 42px;
      min-width: 42px;
      border-radius: 13px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 19px;
      cursor: pointer;
    }

    /* =========================
       CHAT
    ========================== */

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px 20px;
      scroll-behavior: smooth;
    }

    #chat::-webkit-scrollbar {
      width: 5px;
    }

    #chat::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 20px;
    }

    .welcome {
      min-height: 60vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .welcome-logo {
      width: 90px;
      height: 90px;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      background: var(--primary);
      color: var(--bg);
      box-shadow: 0 12px 35px rgba(0,0,0,.15);
      margin-bottom: 18px;
    }

    .welcome h2 {
      margin: 0;
      font-size: 28px;
    }

    .welcome p {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }

    .message {
      width: fit-content;
      max-width: 86%;
      padding: 12px 15px;
      margin: 9px 0;
      border-radius: 18px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-wrap: break-word;
      animation: messageIn .2s ease;
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .user {
      margin-right: auto;
      background: var(--user);
      color: white;
      border-bottom-right-radius: 5px;
    }

    .ai {
      margin-left: auto;
      background: var(--ai);
      color: var(--text);
      border: 1px solid var(--border);
      border-bottom-left-radius: 5px;
      box-shadow: 0 3px 12px rgba(0,0,0,.04);
    }

    .message img {
      display: block;
      max-width: 280px;
      width: 100%;
      border-radius: 14px;
    }

    /* =========================
       STATUS
    ========================== */

    #status {
      min-height: 22px;
      padding: 3px 12px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }

    /* =========================
       INPUT
    ========================== */

    .input-area {
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .input-box {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px;
      border: 1px solid var(--border);
      background: var(--bg);
      border-radius: 17px;
    }

    #message {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      padding: 11px 8px;
      font-size: 16px;
      direction: rtl;
    }

    #message::placeholder {
      color: var(--muted);
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      min-width: 42px;
      border: none;
      border-radius: 13px;
      background: transparent;
      color: var(--text);
      font-size: 20px;
      cursor: pointer;
    }

    .icon-btn:hover {
      background: var(--border);
    }

    #send {
      width: 48px;
      height: 48px;
      min-width: 48px;
      border: none;
      border-radius: 15px;
      background: var(--primary);
      color: var(--bg);
      font-size: 21px;
      cursor: pointer;
      transition: transform .15s;
    }

    #send:active {
      transform: scale(.93);
    }

    #send:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #mic.recording {
      background: #dc2626;
      color: white;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(220,38,38,.35);
      }

      70% {
        box-shadow: 0 0 0 10px rgba(220,38,38,0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(220,38,38,0);
      }
    }

    #imageInput {
      display: none;
    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 600px) {

      header {
        padding: 11px 12px;
      }

      .brand-logo {
        width: 42px;
        height: 42px;
        border-radius: 13px;
        font-size: 22px;
      }

      .brand-text h1 {
        font-size: 17px;
      }

      .online {
        display: none;
      }

      #chat {
        padding: 18px 11px;
      }

      .welcome h2 {
        font-size: 24px;
      }

      .welcome p {
        font-size: 14px;
      }

      .message {
        max-width: 91%;
      }

      .input-area {
        padding-left: 8px;
        padding-right: 8px;
      }

      #send {
        width: 45px;
        min-width: 45px;
        height: 45px;
      }
    }
  </style>
</head>
