<!DOCTYPE html>
<html lang="ku" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SamanAI</title>

  <style>

    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #737b8c;
      --border: #e5e7eb;
      --bubble-ai: #ffffff;
      --bubble-user: #111827;
      --button: #111827;
      --button-text: #ffffff;
    }

    body.dark {
      --bg: #080d18;
      --card: #101827;
      --text: #f8fafc;
      --muted: #9ca3af;
      --border: #263244;
      --bubble-ai: #111827;
      --bubble-user: #273449;
      --button: #f8fafc;
      --button-text: #111827;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
    }

    body {
      font-family: Arial, sans-serif;
      color: var(--text);
      transition: .25s;
    }

    button,
    input {
      font-family: inherit;
    }

    .app {
      width: 100%;
      max-width: 900px;
      height: 100dvh;
      margin: auto;

      display: flex;
      flex-direction: column;

      background: var(--bg);
    }

    /* =========================
       HEADER
    ========================= */

    header {
      flex-shrink: 0;

      height: 72px;
      padding: 10px 14px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: var(--card);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 48px;
      height: 48px;

      border-radius: 16px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #111827;

      font-size: 25px;

      box-shadow:
        0 7px 22px rgba(0, 0, 0, .12);
    }

    .brand-text h1 {
      margin: 0;
      font-size: 19px;
    }

    .brand-text p {
      margin: 3px 0 0;

      color: var(--muted);

      font-size: 11px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .online {
      display: flex;
      align-items: center;
      gap: 5px;

      color: #16a34a;

      font-size: 11px;
      font-weight: bold;
    }

    .dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: #22c55e;
    }

    #themeBtn {
      width: 42px;
      height: 42px;

      border-radius: 13px;

      border: 1px solid var(--border);

      background: var(--bg);
      color: var(--text);

      font-size: 19px;

      cursor: pointer;
    }

    /* =========================
       CHAT
    ========================= */

    #chat {
      flex: 1;
      min-height: 0;

      overflow-y: auto;

      padding: 20px 14px;

      scroll-behavior: smooth;
    }

    #chat::-webkit-scrollbar {
      width: 4px;
    }

    #chat::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 20px;
    }

    /* =========================
       WELCOME
    ========================= */

    .welcome {
      height: 100%;
      min-height: 0;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;

      padding: 20px;
    }

    .welcome-logo {
      width: 100px;
      height: 100px;

      border-radius: 30px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #111827;

      font-size: 52px;

      box-shadow:
        0 15px 40px rgba(0, 0, 0, .16);

      margin-bottom: 20px;
    }

    .welcome h2 {
      margin: 0;

      font-size: 27px;

      color: var(--text);
    }

    .welcome p {
      margin-top: 10px;

      color: var(--muted);

      font-size: 14px;
      line-height: 1.8;
    }

    /* =========================
       MESSAGES
    ========================= */

    .message {
      width: fit-content;
      max-width: 88%;

      padding: 12px 15px;

      margin: 8px 0;

      border-radius: 18px;

      line-height: 1.7;

      white-space: pre-wrap;
      word-break: break-word;

      animation: appear .2s ease;
    }

    @keyframes appear {

      from {
        opacity: 0;
        transform: translateY(7px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }

    .user {
      margin-right: auto;

      background: var(--bubble-user);
      color: white;

      border-bottom-right-radius: 5px;
    }

    .ai {
      margin-left: auto;

      background: var(--bubble-ai);
      color: var(--text);

      border: 1px solid var(--border);

      border-bottom-left-radius: 5px;

      box-shadow:
        0 3px 12px rgba(0, 0, 0, .04);
    }

    .message img {
      display: block;

      max-width: 280px;
      width: 100%;

      border-radius: 14px;
    }

    /* =========================
       STATUS
    ========================= */

    #status {
      flex-shrink: 0;

      min-height: 22px;

      text-align: center;

      color: var(--muted);

      font-size: 11px;

      padding: 3px;
    }

    /* =========================
       INPUT
    ========================= */

    .input-area {
      flex-shrink: 0;

      padding: 9px 10px;

      padding-bottom:
        calc(9px + env(safe-area-inset-bottom));

      display: flex;
      align-items: center;

      gap: 7px;

      background: var(--card);

      border-top: 1px solid var(--border);
    }

    .input-box {
      flex: 1;
      min-width: 0;

      height: 50px;

      display: flex;
      align-items: center;

      background: var(--bg);

      border: 1px solid var(--border);

      border-radius: 17px;

      padding: 3px 5px;
    }

    #message {
      flex: 1;
      min-width: 0;

      border: none;
      outline: none;

      background: transparent;

      color: var(--text);

      font-size: 16px;

      padding: 10px;

      direction: rtl;
    }

    #message::placeholder {
      color: var(--muted);
    }

    .icon-btn {
      width: 43px;
      height: 43px;

      min-width: 43px;

      border: none;

      border-radius: 13px;

      background: transparent;

      color: var(--text);

      font-size: 20px;

      cursor: pointer;
    }

    .icon-btn:active {
      transform: scale(.92);
    }

    .icon-btn:hover {
      background: var(--border);
    }

    #send {
      width: 50px;
      height: 50px;

      min-width: 50px;

      border: none;

      border-radius: 16px;

      background: var(--button);

      color: var(--button-text);

      font-size: 21px;

      cursor: pointer;
    }

    #send:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    /* =========================
       MICROPHONE
    ========================= */

    #mic.recording {
      background: #dc2626;
      color: white;

      animation: pulse 1s infinite;
    }

    @keyframes pulse {

      0% {
        box-shadow:
          0 0 0 0 rgba(220, 38, 38, .4);
      }

      70% {
        box-shadow:
          0 0 0 10px rgba(220, 38, 38, 0);
      }

      100% {
        box-shadow:
          0 0 0 0 rgba(220, 38, 38, 0);
      }

    }

    #imageInput {
      display: none;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      header {
        height: 66px;
        padding: 8px 10px;
      }

      .logo {
        width: 44px;
        height: 44px;

        border-radius: 14px;
      }

      .brand-text h1 {
        font-size: 17px;
      }

      .online {
        display: none;
      }

      #chat {
        padding: 15px 10px;
      }

      .welcome-logo {
        width: 88px;
        height: 88px;

        border-radius: 27px;

        font-size: 46px;
      }

      .welcome h2 {
        font-size: 23px;
      }

      .message {
        max-width: 92%;
      }

      .input-area {
        gap: 5px;

        padding-left: 7px;
        padding-right: 7px;
      }

      .input-box {
        height: 48px;
      }

      .icon-btn {
        width: 40px;
        height: 40px;

        min-width: 40px;
      }

      #send {
        width: 47px;
        height: 47px;

        min-width: 47px;
      }

    }

  </style>
</head>


<body>

<div class="app">

  <!-- =========================
       HEADER
  ========================== -->

  <header>

    <div class="brand">

      <div class="logo">
        🤖
      </div>

      <div class="brand-text">

        <h1>SamanAI</h1>

        <p>
          یاریدەدەری زیرەکی تۆ
        </p>

      </div>

    </div>


    <div class="header-right">

      <div class="online">

        <span class="dot"></span>

        Online

      </div>


      <button
        id="themeBtn"
        type="button"
      >
        🌙
      </button>

    </div>

  </header>


  <!-- =========================
       CHAT
  ========================== -->

  <div id="chat">

    <div
      class="welcome"
      id="welcome"
    >

      <div class="welcome-logo">
        🤖
      </div>

      <h2>
        بەخێربێیت بۆ SamanAI
      </h2>

      <p>
        من ئامادەم بۆ گفتوگۆ ❤️
        <br>
        بنووسە، قسە بکە، یان وێنەیەک بنێرە.
      </p>

    </div>

  </div>


  <div id="status"></div>


  <!-- =========================
       INPUT AREA
  ========================== -->

  <div class="input-area">


    <button
      class="icon-btn"
      id="imageBtn"
      type="button"
      title="ناردنی وێنە"
    >
      📷
    </button>


    <input
      id="imageInput"
      type="file"
      accept="image/*"
    >


    <div class="input-box">

      <input
        id="message"
        type="text"
        placeholder="نامەکەت بنووسە..."
        autocomplete="off"
      >


      <button
        class="icon-btn"
        id="mic"
        type="button"
        title="دەنگ"
      >
        🎙️
      </button>

    </div>


    <button
      id="send"
      type="button"
      title="ناردن"
    >
      ➤
    </button>

  </div>

</div>


<script>

"use strict";


/* =========================
   GLOBAL VARIABLES
========================= */

let messages = [];

let recognition = null;

let isSending = false;


/* =========================
   USER ID
========================= */

function getUserId() {

  let userId =
    localStorage.getItem(
      "samanai-user-id"
    );


  if (!userId) {

    if (
      window.crypto &&
      typeof window.crypto.randomUUID ===
        "function"
    ) {

      userId =
        window.crypto.randomUUID();

    } else {

      userId =
        "user-" +
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .slice(2);

    }


    localStorage.setItem(
      "samanai-user-id",
      userId
    );

  }


  return userId;

}


const userId = getUserId();


/* =========================
   ELEMENTS
========================= */

const chat =
  document.getElementById("chat");

const input =
  document.getElementById("message");

const sendButton =
  document.getElementById("send");

const micButton =
  document.getElementById("mic");

const imageButton =
  document.getElementById("imageBtn");

const imageInput =
  document.getElementById("imageInput");

const statusElement =
  document.getElementById("status");

const themeButton =
  document.getElementById("themeBtn");


/* =========================
   THEME
========================= */

function loadTheme() {

  const theme =
    localStorage.getItem(
      "samanai-theme"
    );


  if (theme === "dark") {

    document.body.classList.add(
      "dark"
    );

    themeButton.textContent =
      "☀️";

  } else {

    themeButton.textContent =
      "🌙";

  }

}


function toggleTheme() {

  document.body.classList.toggle(
    "dark"
  );


  const dark =
    document.body.classList.contains(
      "dark"
    );


  themeButton.textContent =
    dark
      ? "☀️"
      : "🌙";


  localStorage.setItem(
    "samanai-theme",
    dark
      ? "dark"
      : "light"
  );

}


themeButton.addEventListener(
  "click",
  toggleTheme
);


loadTheme();


/* =========================
   WELCOME
========================= */

function removeWelcome() {

  const welcome =
    document.getElementById(
      "welcome"
    );


  if (welcome) {
    welcome.remove();
  }

}


/* =========================
   ADD MESSAGE
========================= */

function addMessage(
  text,
  type
) {

  const element =
    document.createElement("div");


  element.className =
    "message " + type;


  element.textContent =
    text;


  chat.appendChild(
    element
  );


  chat.scrollTop =
    chat.scrollHeight;


  return element;

}


/* =========================
   SPEECH
========================= */

function speak(text) {

  if (
    !("speechSynthesis" in window)
  ) {
    return;
  }


  if (!text) {
    return;
  }


  try {

    window.speechSynthesis.cancel();


    const utterance =
      new SpeechSynthesisUtterance(
        String(text)
      );


    utterance.lang =
      "ku-IQ";


    utterance.rate =
      0.95;


    utterance.pitch =
      1;


    window.speechSynthesis.speak(
      utterance
    );

  } catch (error) {

    console.log(
      "Speech error:",
      error
    );

  }

}


/* =========================
   VOICE RECOGNITION
========================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (SpeechRecognition) {

  recognition =
    new SpeechRecognition();


  recognition.lang =
    "ku-IQ";


  recognition.continuous =
    false;


  recognition.interimResults =
    false;


  recognition.maxAlternatives =
    1;


  recognition.onstart =
    function () {

      micButton.classList.add(
        "recording"
      );


      statusElement.textContent =
        "🎙️ گوێم لێتە...";

    };


  recognition.onresult =
    function (event) {

      let text =
        event
          .results[0][0]
          .transcript;


      text =
        text
          .replace(
            /سومەر/gi,
            "سامان"
          )
          .replace(
            /سۆمەر/gi,
            "سامان"
          )
          .replace(
            /سومار/gi,
            "سامان"
          )
          .replace(
            /Sumer/gi,
            "Saman"
          );


      input.value =
        text;


      statusElement.textContent =
        "دەنگەکە وەرگیرا 🎤";


      sendMessage();

    };


  recognition.onerror =
    function (event) {

      console.log(
        "Speech recognition error:",
        event
      );


      statusElement.textContent =
        "نەتوانرا دەنگ وەرگیرێت.";

    };


  recognition.onend =
    function () {

      micButton.classList.remove(
        "recording"
      );

    };

}


/* =========================
   START VOICE
========================= */

function startVoice() {

  if (!recognition) {

    alert(
      "Browser ـەکەت Speech Recognition پشتگیری ناکات. Chrome تاقی بکەرەوە."
    );

    return;

  }


  try {

    recognition.start();

  } catch (error) {

    console.log(
      "Recognition start:",
      error
    );

  }

}


micButton.addEventListener(
  "click",
  startVoice
);


/* =========================
   FILE TO BASE64
========================= */

function fileToBase64(file) {

  return new Promise(
    function (resolve, reject) {

      const reader =
        new FileReader();


      reader.onload =
        function () {

          const result =
            String(
              reader.result || ""
            );


          const commaIndex =
            result.indexOf(",");


          if (
            commaIndex === -1
          ) {

            reject(
              new Error(
                "Invalid image data"
              )
            );

            return;

          }


          resolve(
            result.slice(
              commaIndex + 1
            )
          );

        };


      reader.onerror =
        function () {

          reject(
            reader.error ||
            new Error(
              "FileReader error"
            )
          );

        };


      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =========================
   IMAGE BUTTON
========================= */

imageButton.addEventListener(
  "click",
  function () {

    imageInput.click();

  }
);


/* =========================
   HANDLE IMAGE
========================= */

imageInput.addEventListener(
  "change",
  handleImage
);


async function handleImage(event) {

  const file =
    event.target.files &&
    event.target.files[0];


  if (!file) {
    return;
  }


  removeWelcome();


  const imageMessage =
    document.createElement("div");


  imageMessage.className =
    "message user";


  const image =
    document.createElement("img");


  image.src =
    URL.createObjectURL(
      file
    );


  image.alt =
    "وێنەی نێردراو";


  imageMessage.appendChild(
    image
  );


  chat.appendChild(
    imageMessage
  );


  chat.scrollTop =
    chat.scrollHeight;


  statusElement.textContent =
    "وێنەکە دەنێردرێت... 📷";


  imageButton.disabled =
    true;


  try {

    const base64 =
      await fileToBase64(
        file
      );


    const response =
      await fetch(
        "/api/chat",
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              messages:
                messages,

              image:
                base64,

              imageType:
                file.type,

              userId:
                userId

            })

        }
      );


    const responseText =
      await response.text();


    let data;


    try {

      data =
        JSON.parse(
          responseText
        );

    } catch (parseError) {

      throw new Error(
        "وەڵامی API نادروستە."
      );

    }


    if (!response.ok) {

      throw new Error(
        data.error ||
        "ناردنی وێنە سەرکەوتوو نەبوو."
      );

    }


    const reply =
      typeof data.reply ===
        "string"
        ? data.reply.trim()
        : "";


    if (!reply) {

      throw new Error(
        "AI وەڵامێکی بەتاڵی دا."
      );

    }


    const replyElement =
      addMessage(
        reply,
        "ai"
      );


    messages.push({

      role: "user",

      content:
        "[وێنەیەک نێردرا]"

    });


    messages.push({

      role: "assistant",

      content:
        reply

    });


    saveMessages();


    statusElement.textContent =
      "";


    speak(reply);


  } catch (error) {

    console.error(
      "Image error:",
      error
    );


    addMessage(
      "هەڵە لە ناردنی وێنە: " +
      (
        error?.message ||
        "هەڵەی نەناسراو"
      ),
      "ai"
    );


    statusElement.textContent =
      "";

  } finally {

    imageButton.disabled =
      false;


    imageInput.value =
      "";

    chat.scrollTop =
      chat.scrollHeight;

  }

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage() {

  if (isSending) {
    return;
  }


  const message =
    input.value.trim();


  if (!message) {
    return;
  }


  isSending =
    true;


  removeWelcome();


  addMessage(
    message,
    "user"
  );


  messages.push({

    role: "user",

    content:
      message

  });


  saveMessages();


  input.value =
    "";


  sendButton.disabled =
    true;


  micButton.disabled =
    true;


  imageButton.disabled =
    true;


  const loading =
    addMessage(
      "SamanAI دەگەرێت... 🤔",
      "ai"
    );


  statusElement.textContent =
    "پەیوەندی بە AI...";


  try {

    const response =
      await fetch(
        "/api/chat",
        {

          method: "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              messages:
                messages,

              userId:
                userId

            })

        }
      );


    const responseText =
      await response.text();


    let data;


    try {

      data =
        JSON.parse(
          responseText
        );

    } catch (parseError) {

      throw new Error(
        "وەڵامی API نادروستە."
      );

    }


    if (!response.ok) {

      throw new Error(
        data.error ||
        "کێشەیەک لە پەیوەندی بە AI ڕوویدا."
      );

    }


    const reply =
      typeof data.reply ===
        "string"
        ? data.reply.trim()
        : "";


    if (!reply) {

      throw new Error(
        "AI وەڵامێکی بەتاڵی گەڕاندەوە."
      );

    }


    loading.textContent =
      reply;


    messages.push({

      role:
        "assistant",

      content:
        reply

    });


    saveMessages();


    statusElement.textContent =
      "";


    speak(reply);


  } catch (error) {

    console.error(
      "SamanAI connection error:",
      error
    );


    loading.textContent =
      "هەڵەی پەیوەندی: " +
      (
        error?.message ||
        "هەڵەی نەناسراو"
      );


    statusElement.textContent =
      "";

  } finally {

    isSending =
      false;


    sendButton.disabled =
      false;


    micButton.disabled =
      false;


    imageButton.disabled =
      false;


    input.focus();


    chat.scrollTop =
      chat.scrollHeight;

  }

}


/* =========================
   SEND BUTTON
========================= */

sendButton.addEventListener(
  "click",
  sendMessage
);


/* =========================
   ENTER TO SEND
========================= */

input.addEventListener(
  "keydown",
  function (event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================
   LOCAL CHAT HISTORY
========================= */

function saveMessages() {

  try {

    localStorage.setItem(
      "samanai-chat-history",
      JSON.stringify(
        messages
      )
    );

  } catch (error) {

    console.log(
      "Could not save chat:",
      error
    );

  }

}


function loadMessages() {

  try {

    const saved =
      localStorage.getItem(
        "samanai-chat-history"
      );


    if (!saved) {
      return;
    }


    const parsed =
      JSON.parse(
        saved
      );


    if (
      !Array.isArray(parsed)
    ) {
      return;
    }


    messages =
      parsed.filter(
        function (item) {

          return (
            item &&
            (
              item.role ===
                "user" ||
              item.role ===
                "assistant"
            ) &&
            typeof item.content ===
              "string"
          );

        }
      );


    if (
      messages.length === 0
    ) {
      return;
    }


    removeWelcome();


    for (
      const item of messages
    ) {

      addMessage(
        item.content,
        item.role ===
          "user"
          ? "user"
          : "ai"
      );

    }

  } catch (error) {

    console.log(
      "Could not load chat:",
      error
    );

  }

}


/* =========================
   START
========================= */

loadMessages();


input.focus();

</script>
