<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SamanAI</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #171717;
    }

    .app {
      max-width: 760px;
      height: 100vh;
      margin: auto;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    header small {
      display: block;
      font-size: 12px;
      opacity: .7;
      margin-top: 4px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 14px;
    }

    .welcome {
      text-align: center;
      margin-top: 20vh;
    }

    .logo {
      font-size: 55px;
    }

    .welcome h1 {
      margin: 5px;
      font-size: 30px;
    }

    .welcome p {
      color: #666;
    }

    .message {
      padding: 13px 15px;
      margin: 10px 0;
      border-radius: 16px;
      max-width: 88%;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    .user {
      background: #111827;
      color: white;
      margin-right: auto;
    }

    .ai {
      background: white;
      border: 1px solid #e5e7eb;
      margin-left: auto;
    }

    .input-area {
      padding: 12px;
      background: white;
      border-top: 1px solid #e5e7eb;
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      outline: none;
      font-size: 16px;
    }

    button {
      min-width: 48px;
      height: 48px;
      border: none;
      border-radius: 14px;
      background: #111827;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
    }

    #mic.recording {
      background: #dc2626;
    }

    .status {
      text-align: center;
      font-size: 12px;
      color: #777;
      padding: 4px;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    🤖 SamanAI
    <small>یاریدەدەری زیرەکی تۆ</small>
  </header>

  <div id="chat">

    <div class="welcome" id="welcome">
      <div class="logo">🤖</div>
      <h1>بەخێربێیت بۆ SamanAI</h1>
      <p>دەتوانیت بنووسیت یان قسە بکەیت 🎤</p>
    </div>

  </div>

  <div class="status" id="status"></div>

  <div class="input-area">
    <<button
  id="imageBtn"
  type="button"
  onclick="document.getElementById('imageInput').click()">
  📷
</button>

<<<input
  id="imageInput"
  type="file"
  accept="image/*"
  onchange="handleImage(event)"
>
>
>
    <input
      id="message"
      placeholder="نامەکەت بنووسە..."
      autocomplete="off"
    >

    <button id="send" onclick="sendMessage()">➤</button>
  </div>

</div>

<script>

let messages = [];

let recognition = null;
document.getElementById("imageInput").addEventListener("change", function(event) {
  const file = event.target.files[0];

  if (file) {
    alert("وێنەکە هەڵبژێردرا: " + file.name);
  } else {
    alert("هیچ وێنەیەک هەڵنەبژێردرا");
  }
});
const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

if (SpeechRecognition) {

  recognition = new SpeechRecognition();

  recognition.lang = "ku-IQ";

  recognition.continuous = false;

  recognition.interimResults = false;

  recognition.onstart = function() {
    document.getElementById("mic").classList.add("recording");
    document.getElementById("status").textContent =
      "🎤 گوێم لێتە...";
  };

  recognition.onresult = function(event) {

    let text =
  event.results[0][0].transcript;

text = text
  .replace(/سومەر/gi, "سامان")
  .replace(/سۆمەر/gi, "سامان")
  .replace(/سومار/gi, "سامان")
  .replace(/Sumer/gi, "Saman");

document.getElementById("message").value = text;
  

    document.getElementById("message").value = text;

    document.getElementById("status").textContent =
      "دەقەکە ئامادەیە — تکایە پێداچوونەوەی بۆ بکە";

    sendMessage();
  };

  recognition.onerror = function() {

    document.getElementById("status").textContent =
      "نەتوانرا دەنگ وەرگیرێت.";

    document.getElementById("mic").classList.remove("recording");
  };

  recognition.onend = function() {

    document.getElementById("mic").classList.remove("recording");

  };

}

function startVoice() {

  if (!recognition) {

    alert(
      "Browser ـەکەت Speech Recognition پشتگیری ناکات. Chrome تاقی بکەرەوە."
    );

    return;
  }

  try {
    recognition.start();
  } catch (error) {
    console.log(error);
  }

}
async function handleImage(event) {
  alert("وێنە هەڵبژێردرا");
  
  const file = event.target.files[0];

  if (!file) return;

  const chat = document.getElementById("chat");

  const imageMessage = document.createElement("div");
  imageMessage.className = "message user";

  const image = document.createElement("img");
  image.src = URL.createObjectURL(file);
  image.style.maxWidth = "100%";
  image.style.borderRadius = "12px";

  imageMessage.appendChild(image);
  chat.appendChild(imageMessage);

  const loading = document.createElement("div");
  loading.className = "message ai";
  loading.textContent = "SamanAI وێنەکە دەبینێت... 👀";
  chat.appendChild(loading);

  try {
    const base64 = await fileToBase64(file);

    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        messages: messages,
        image: base64
        imageType: file.type
      })
    });

    const data = await response.json();

    if (!response.ok) {
      loading.textContent = data.error || "هەڵەیەک ڕوویدا.";
    } else {
      loading.textContent = data.reply;
      speak(data.reply);
    }

  } catch (error) {
    loading.textContent = "نەتوانرا وێنەکە بنێردرێت.";
  }

  event.target.value = "";
  chat.scrollTop = chat.scrollHeight;
}


function fileToBase64(file) {
  return new Promise((resolve, reject) => {

    const reader = new FileReader();

    reader.onload = () => {
      const result = reader.result;

      resolve(result.split(",")[1]);
    };

    reader.onerror = reject;

    reader.readAsDataURL(file);
  });
}
async function sendMessage() {

  const input =
    document.getElementById("message");

  const button =
    document.getElementById("send");

  const chat =
    document.getElementById("chat");

  const message =
    input.value.trim();

  if (!message) return;

  const welcome =
    document.getElementById("welcome");

  if (welcome) welcome.remove();

  const userMessage =
    document.createElement("div");

  userMessage.className =
    "message user";

  userMessage.textContent =
    message;

  chat.appendChild(userMessage);

  messages.push({
    role: "user",
    content: message
  });

  input.value = "";

  button.disabled = true;

  const loading =
    document.createElement("div");

  loading.className =
    "message ai";

  loading.textContent =
    "SamanAI وەڵام دەداتەوە... 🤔";

  chat.appendChild(loading);

  try {

    const response =
      await fetch("/api/chat", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          messages: messages
        })

      });

    const data =
      await response.json();

    if (!response.ok) {

      loading.textContent =
        data.error ||
        "هەڵەیەک ڕوویدا.";

    } else {

      loading.textContent =
        data.reply;

      messages.push({
        role: "assistant",
        content: data.reply
      });

      speak(data.reply);
    }

  } catch (error) {

    loading.textContent =
      "پەیوەندی بە AI نەکرا.";

  }

  button.disabled = false;

  input.focus();

  chat.scrollTop =
    chat.scrollHeight;
}

function speak(text) {

  if (!("speechSynthesis" in window)) {
    return;
  }

  window.speechSynthesis.cancel();

  const speech =
    new SpeechSynthesisUtterance(text);

  speech.lang = "ku";

  speech.rate = 0.95;

  speech.pitch = 1;

  window.speechSynthesis.speak(speech);
}

document
  .getElementById("message")
  .addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
      sendMessage();
    }

  });

</script>

</body>
</html>
